<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><title>Endless Survivor Mini</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:sans-serif}
#c{display:block;background:#000;cursor:crosshair}
#hud{position:fixed;top:10px;left:10px;color:#8be9ff;font-size:20px;text-shadow:0 0 8px #8be9ff}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.75)}
#msg h1{color:#ffd166;text-shadow:0 0 20px #ffd166}
button{margin-top:14px;padding:10px 30px;font-size:16px;border:none;border-radius:30px;background:#8be9ff;cursor:pointer}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud">Score: <span id="s">0</span> &nbsp; Best: <span id="b">0</span></div>
<div id="msg"><h1 id="h1">ENDLESS SURVIVOR</h1><p>Mouse hilao, bombs se bacho, jitni der zinda raho utna score.</p><button id="go">START</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener('resize',rs);rs();
const sEl=document.getElementById('s'),bEl=document.getElementById('b'),msg=document.getElementById('msg'),h1=document.getElementById('h1'),go=document.getElementById('go');
let best=+localStorage.getItem('esMiniBest')||0;bEl.textContent=best;
let p,obs,score,run,mx,my,last,spawnT;
function reset(){
  p={x:W/2,y:H*0.7,r:14};obs=[];score=0;run=true;spawnT=0;last=0;
  mx=p.x;my=p.y;msg.style.display='none';requestAnimationFrame(loop);
}
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:true});
function spawn(){
  const r=14+Math.random()*20,x=Math.random()*W,speed=140+score*0.4;
  obs.push({x,y:-r,r,vy:speed,vx:(Math.random()-0.5)*80,hue:Math.random()*30});
}
function loop(ts){
  if(!run)return;
  if(!last)last=ts;const dt=Math.min(40,ts-last)/1000;last=ts;
  score+=dt*20;
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=Math.max(0.15,0.7-score*0.003);}
  p.x+=(mx-p.x)*0.15;p.y+=(my-p.y)*0.15;
  ctx.fillStyle='#05070d';ctx.fillRect(0,0,W,H);
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];o.x+=o.vx*dt;o.y+=o.vy*dt;
    ctx.fillStyle=`hsl(${o.hue},80%,50%)`;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
    if(o.y>H+40){obs.splice(i,1);continue;}
    if(Math.hypot(o.x-p.x,o.y-p.y)<o.r+p.r-4){run=false;endGame();return;}
  }
  ctx.fillStyle='#8be9ff';ctx.shadowColor='#8be9ff';ctx.shadowBlur=18;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.shadowBlur=0;
  sEl.textContent=Math.floor(score);
  requestAnimationFrame(loop);
}
function endGame(){
  if(score>best){best=Math.floor(score);localStorage.setItem('esMiniBest',best);bEl.textContent=best;}
  h1.textContent='GAME OVER — Score: '+Math.floor(score);go.textContent='PLAY AGAIN';msg.style.display='flex';
}
go.onclick=reset;
</script>
</body></html>
